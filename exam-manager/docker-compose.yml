version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: exam_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exampass123}
      POSTGRES_DB: ${POSTGRES_DB:-exam_manager}
    volumes:
      # Database data stored in Docker volume (NOT in Dropbox - safe!)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examuser} -d ${POSTGRES_DB:-exam_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam_manager_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-examuser}:${POSTGRES_PASSWORD:-exampass123}@db:5432/${POSTGRES_DB:-exam_manager}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-key-change-in-production}
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    volumes:
      # Uploads folder - synced in Dropbox for backup
      - ./uploads:/app/uploads
      # Backups folder - synced in Dropbox for backup
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  # Backup service - runs daily backups
  backup:
    image: postgres:15-alpine
    container_name: exam_manager_backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-examuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-exampass123}
      PGDATABASE: ${POSTGRES_DB:-exam_manager}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup service started. Running daily backups at 2 AM."
        while true; do
          # Create timestamped backup
          BACKUP_FILE="/backups/exam_manager_$$(date +%Y%m%d_%H%M%S).sql"
          pg_dump > "$$BACKUP_FILE"
          echo "Backup created: $$BACKUP_FILE"

          # Keep only last 30 backups
          ls -t /backups/*.sql 2>/dev/null | tail -n +31 | xargs -r rm

          # Sleep for 24 hours
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    # This volume is managed by Docker, stored outside Dropbox (safe!)
    name: exam_manager_postgres_data
